<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Grading System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>College Grading System</h1>
        <p class="subtitle">Student Grade Management Dashboard</p>

        <div class="student-info">
            <label>Student Name</label>
            <input type="text" id="studentName" placeholder="Enter student name">

            <label>Student ID</label>
            <input type="text" id="studentID" placeholder="Enter student ID">
        </div>

        <h2>Subject Grades</h2>

        <div class="subjects">

            <div class="subject">
                <label>Developing Cloud Native Applications</label>
                <input type="number" id="grade1" step="0.25" min="1" max="5"
                    placeholder="e.g. 1.50">
            </div>

            <div class="subject">
                <label>Introduction to HDL</label>
                <input type="number" id="grade2" step="0.25" min="1" max="5"
                    placeholder="e.g. 2.00">
            </div>

            <div class="subject">
                <label>Logic Circuits and Design</label>
                <input type="number" id="grade3" step="0.25" min="1" max="5"
                    placeholder="e.g. 1.75">
            </div>

            <div class="subject">
                <label>Operating System</label>
                <input type="number" id="grade4" step="0.25" min="1" max="5"
                    placeholder="e.g. 2.25">
            </div>

        </div>

        <div class="buttons">
            <button onclick="calculateGrades()">Calculate GWA</button>
            <button class="clear" onclick="clearForm()">Clear</button>
        </div>

        <div id="result" class="result">
            <h2>Grade Summary</h2>

            <p><strong>Student:</strong> <span id="displayName">---</span></p>
            <p><strong>Student ID:</strong> <span id="displayID">---</span></p>

            <div class="summary">
                <div>
                    <h3>GWA</h3>
                    <span id="gwa">---</span>
                </div>

                <div>
                    <h3>Highest Grade</h3>
                    <span id="highest">---</span>
                </div>

                <div>
                    <h3>Lowest Grade</h3>
                    <span id="lowest">---</span>
                </div>

                <div>
                    <h3>Status</h3>
                    <span id="status">---</span>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Grade</th>
                        <th>Remarks</th>
                    </tr>
                </thead>

                <tbody id="gradeTable">
                </tbody>
            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
